<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Test — CATprep Pro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap" id="player">
    <div class="mock-top">
      <h2 id="mock-title" style="margin:0;">Loading…</h2>
      <div style="display:flex; gap:12px; align-items:center;">
        <div class="timer" id="timer">--:--</div>
        <button class="btn green" onclick="submitMock()">Submit</button>
      </div>
    </div>

    <div class="mock-layout">
      <div id="qarea"></div>
      <div>
        <div class="card">
          <h3 style="font-size:0.9rem;">Question Palette</h3>
          <p id="pal-stats" style="font-size:0.8rem;"></p>
          <div class="palette" id="palette"></div>
          <div style="font-size:0.75rem; color:var(--text-dim); margin-top:12px; line-height:1.9;">
            <span class="badge green">■</span> Answered&nbsp;
            <span class="badge purple">■</span> Marked<br>
            MCQ +3/−1 · TITA +3/0
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data/qa.js"></script>
  <script src="js/data/varc.js"></script>
  <script src="js/data/lrdi.js"></script>
  <script src="js/data/mocks.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mock.js"></script>
</body>
</html>
